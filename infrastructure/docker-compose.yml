version: '3.8'

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: greenslips-postgres-dev
    environment:
      POSTGRES_USER: greenslips
      POSTGRES_PASSWORD: <REDACTED>
      POSTGRES_DB: greenslips
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: greenslips-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  wiremock:
    image: wiremock/wiremock:latest
    container_name: greenslips-wiremock-dev
    ports:
      - "8080:8080"
    volumes:
      - ./src/Api/MockData:/home/wiremock
    restart: unless-stopped

volumes:
  pgdata:
